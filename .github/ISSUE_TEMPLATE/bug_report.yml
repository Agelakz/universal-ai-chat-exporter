name: Bug report
description: Report a reproducible extension problem
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [ChatGPT, Gemini, Extension popup or download]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Browser and extension versions
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Use synthetic examples; do not include private conversations, cookies, or tokens.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
